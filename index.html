<head>
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

        <h1>Weather App</h1>

        <div class="search-box">
            <input type="text" placeholder="Masukkan kota">

        </div>

        </div>

        <div class="details">
            <div class="detail-box">

                <p>💧</p>

            </div>
            <div class="detail-box">
                <p>🌡️</p>

                <p>32°C</p>
            </div>
            

        </div>

            <p>🌅 Matahari terbit: 05:45</p>
