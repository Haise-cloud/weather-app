<!  DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css"
</head>

<body>
    <div class="Weather-app">
        <h1>Weather App</h1>
        <div class="search-box">
            <input type="text" placeholder="masukan kota">
            <button>Cari</button>
        </div>
        <div class="weather-info">
            <h2>Tegal</h2>
            <div class="weather-icon"></div>
            
            <p class="temperature">30°C</p>
            <p class="condition">🌤</p>
            <p class="condition">cerah</p>
            

        </div>
        <!-- informasi tambahan -->
        <div class="details">
            <p> kelembapan: 70%</p>
            <p> angin: 12 km/h</p>
            <P> terasa seperti: 32°C</P>
        </div>
        <div class="fetails2">
            <p>matahari terbit: 05:45</p>
            <p>matahari terbenam: 17:50</p>
        </div>

        
    </div>
</body>
</html>
